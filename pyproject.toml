[project]
name = "topopt"
version = "1.0.0"
description = "A clean, documented 2D SIMP topology optimizer in Python (Q4 FEA, filters, OC, STL export)"
authors = [{ name = "Piyush Bhamare" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools]
packages = ["topopt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
